x-app-common: &app-common
  image: farebeacon:local
  pull_policy: never
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: runtime
  environment: &app-environment
    FAREBEACON_ENV: ${FAREBEACON_ENV:-development}
    FAREBEACON_DATABASE_URL: postgresql+psycopg://farebeacon:${FAREBEACON_POSTGRES_PASSWORD:?set FAREBEACON_POSTGRES_PASSWORD in .env}@postgres:5432/farebeacon
    FAREBEACON_REDIS_URL: redis://redis:6379/0
    FAREBEACON_ARTIFACTS_ROOT: /var/lib/farebeacon/artifacts
    FAREBEACON_LOG_LEVEL: ${FAREBEACON_LOG_LEVEL:-INFO}
    FAREBEACON_CELERY_TASK_ALWAYS_EAGER: ${FAREBEACON_CELERY_TASK_ALWAYS_EAGER:-false}
    FAREBEACON_DEFAULT_SOURCE_TIMEOUT_SECONDS: ${FAREBEACON_DEFAULT_SOURCE_TIMEOUT_SECONDS:-30}
    FAREBEACON_DEFAULT_ALERT_COOLDOWN_MINUTES: ${FAREBEACON_DEFAULT_ALERT_COOLDOWN_MINUTES:-1440}
    FAREBEACON_MAX_REQUEST_BODY_BYTES: ${FAREBEACON_MAX_REQUEST_BODY_BYTES:-1048576}
    FAREBEACON_MAX_SOURCE_PAYLOAD_BYTES: ${FAREBEACON_MAX_SOURCE_PAYLOAD_BYTES:-4194304}
    TZ: ${TZ:-America/Sao_Paulo}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - internal
  logging: &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  postgres:
    image: farebeacon-postgres:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: farebeacon-postgres
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farebeacon
      POSTGRES_USER: farebeacon
      POSTGRES_PASSWORD: ${FAREBEACON_POSTGRES_PASSWORD:?set FAREBEACON_POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farebeacon -d farebeacon"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  redis:
    image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    container_name: farebeacon-redis
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    <<: *app-common
    container_name: farebeacon-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    <<: *app-common
    container_name: farebeacon-api
    environment:
      <<: *app-environment
      FAREBEACON_API_TOKEN: ${FAREBEACON_API_TOKEN:?set FAREBEACON_API_TOKEN in .env}
    command: ["uvicorn", "farebeacon.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${FAREBEACON_PORT:-8000}:8000"
    networks:
      - internal
      - ingress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  scheduler:
    <<: *app-common
    container_name: farebeacon-scheduler
    command:
      [
        "celery",
        "-A",
        "farebeacon.tasks.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  orchestration-worker:
    <<: *app-common
    container_name: farebeacon-orchestration-worker
    command:
      [
        "celery",
        "-A",
        "farebeacon.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=orchestration,maintenance",
        "--concurrency=1",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mock-worker:
    <<: *app-common
    container_name: farebeacon-mock-worker
    command:
      [
        "celery",
        "-A",
        "farebeacon.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=source.mock",
        "--concurrency=2",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  normalization-worker:
    <<: *app-common
    container_name: farebeacon-normalization-worker
    command:
      [
        "celery",
        "-A",
        "farebeacon.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=normalize",
        "--concurrency=2",
      ]
    volumes:
      - artifacts:/var/lib/farebeacon/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notification-worker:
    <<: *app-common
    container_name: farebeacon-notification-worker
    environment:
      <<: *app-environment
      FAREBEACON_NOTIFICATION_BACKEND: ${FAREBEACON_NOTIFICATION_BACKEND:-disabled}
      FAREBEACON_TELEGRAM_BOT_TOKEN: ${FAREBEACON_TELEGRAM_BOT_TOKEN:-}
      FAREBEACON_TELEGRAM_CHAT_ID: ${FAREBEACON_TELEGRAM_CHAT_ID:-}
      FAREBEACON_TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${FAREBEACON_TELEGRAM_REQUEST_TIMEOUT_SECONDS:-10}
    command:
      [
        "celery",
        "-A",
        "farebeacon.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=notifications",
        "--concurrency=1",
      ]
    networks:
      - internal
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

networks:
  internal:
    name: farebeacon-internal
    driver: bridge
    internal: true
  ingress:
    name: farebeacon-ingress
    driver: bridge
  egress:
    name: farebeacon-egress
    driver: bridge

volumes:
  postgres_data:
    name: farebeacon-postgres-data
  redis_data:
    name: farebeacon-redis-data
  artifacts:
    name: farebeacon-artifacts

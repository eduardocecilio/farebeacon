name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: test
          load: true
          tags: farebeacon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ruff
        run: |
          docker run --rm farebeacon:test ruff check .
          docker run --rm farebeacon:test ruff format --check .
      - name: Mypy
        run: docker run --rm farebeacon:test mypy src
      - name: Tests
        run: docker run --rm farebeacon:test pytest --cov=farebeacon --cov-report=term-missing
      - name: OpenAPI generation
        run: docker run --rm farebeacon:test python -m farebeacon.scripts.export_openapi /home/farebeacon/openapi.json

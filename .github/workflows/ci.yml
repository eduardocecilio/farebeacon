name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAREBEACON_API_TOKEN: ci-only-token-with-at-least-thirty-two-characters
      FAREBEACON_POSTGRES_PASSWORD: ci-only-database-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build isolated test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: test
          load: true
          tags: farebeacon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and verify runtime images
        run: |
          docker build --target runtime -t farebeacon:runtime -f docker/api.Dockerfile .
          docker build -t farebeacon-postgres:test -f docker/postgres.Dockerfile .
          docker run --rm --entrypoint sh farebeacon:runtime -c \
            'test "$(id -u)" = 10001 && ! test -e /usr/local/bin/pip'
          docker run --rm --entrypoint sh farebeacon:test -c \
            'test "$(id -u)" = 10001 && ! test -e /usr/local/bin/pip'
          docker run --rm --entrypoint sh farebeacon-postgres:test -c \
            'test "$(id -u)" = 70 && ! test -e /usr/local/bin/gosu'
          docker compose config --quiet
      - name: Ruff
        run: |
          docker run --rm farebeacon:test ruff check .
          docker run --rm farebeacon:test ruff format --check .
      - name: Mypy
        run: docker run --rm farebeacon:test mypy src
      - name: Tests
        run: docker run --rm farebeacon:test pytest --cov=farebeacon --cov-report=term-missing
      - name: OpenAPI generation
        run: >-
          docker run --rm
          -e FAREBEACON_API_TOKEN
          farebeacon:test
          python -m farebeacon.scripts.export_openapi /home/farebeacon/openapi.json
